apiVersion: apps/v1
kind: Deployment
metadata:
  name: hercules-api
  namespace: hercules
  labels:
    app: hercules-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hercules-api
  template:
    metadata:
      labels:
        app: hercules-api
    spec:
      containers:
        - name: hercules-api
          image: hercules-api:latest   # replaced by your CI/CD or local build
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: hercules-api-config
            - secretRef:
                name: hercules-api-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
